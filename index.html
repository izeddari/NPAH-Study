<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>English sentence study</title>

/* ============================================================
   Design tokens. Light and dark themes follow the device setting.
   ============================================================ */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#18212B; --muted:#56616D; --line:#D5DBE1;
  --accent:#2B5F75; --accent-ink:#FFFFFF; --accent-soft:#E3EEF2;
  --warn:#7A4F0E; --warn-soft:#FBF1DE; --bad:#9B3B2E; --ok:#2E6B4F;
  --s1:#A0473A; --s2:#B86E4E; --s3:#C29A6A; --s4:#7FA39A; --s5:#4E8878; --s6:#2B6A5A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:10px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11161B; --surface:#1A2129; --ink:#E5E9ED; --muted:#9AA6B2; --line:#2D3742;
    --accent:#86B7CB; --accent-ink:#0E1419; --accent-soft:#1F2E36;
    --warn:#E3B66A; --warn-soft:#2E2618; --bad:#E08A7C; --ok:#8CC7A8;
    --s1:#D98474; --s2:#D9A07E; --s3:#D6BE92; --s4:#9CC3B8; --s5:#7DB8A6; --s6:#5FA892;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Header */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:880px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.brand{font-weight:600;font-size:15px}
.brand .part{color:var(--muted);font-weight:400}
.progress-text{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line)}
.bar > span{display:block;height:100%;background:var(--accent);transition:width .25s ease}

/* Layout */
main{max-width:880px;margin:0 auto;padding:32px 20px 80px}
.narrow{max-width:720px}
h1{font-size:28px;line-height:1.25;margin:0 0 16px;font-weight:650}
h2{font-size:19px;margin:28px 0 8px;font-weight:650}
p{margin:0 0 14px}
.lede{font-size:18px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:15px}
ul.guide{padding-left:22px;margin:0 0 14px}
ul.guide li{margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.card + .card{margin-top:16px}
.note{background:var(--accent-soft);border-radius:var(--radius);padding:14px 16px;margin:16px 0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:var(--radius);padding:14px 16px;margin:16px 0}
.error{color:var(--bad);font-size:15px;margin-top:8px;min-height:1.4em}

/* Buttons */
.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:28px;flex-wrap:wrap}
.actions.end{justify-content:flex-end}
.btn{font:inherit;font-size:16px;font-weight:600;border-radius:8px;padding:12px 22px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:46px}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;color:var(--muted);border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}

/* Stimuli */
.stim{font-family:var(--serif);font-size:clamp(20px,3.6vw,30px);line-height:1.45;-webkit-user-select:none;user-select:none}
.sources{font-family:var(--serif);font-size:clamp(19px,3vw,25px);line-height:1.5;-webkit-user-select:none;user-select:none}
.sources p{margin:0 0 6px}
.label{font-size:14px;color:var(--muted);margin:0 0 8px}

/* SCT answer box with locked prefix */
.answer{position:relative;margin-top:8px}
.answer .prefix{position:absolute;top:15px;left:17px;font-family:var(--serif);font-size:clamp(19px,3vw,24px);line-height:1.5;font-weight:700;pointer-events:none;white-space:nowrap}
.answer textarea{display:block;width:100%;min-height:128px;resize:vertical;font-family:var(--serif);font-size:clamp(19px,3vw,24px);line-height:1.5;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink)}
.answer textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.answer.static{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px;font-family:var(--serif);font-size:clamp(18px,2.8vw,22px)}

/* GJT scale */
.stim-wrap{min-height:140px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 8px 32px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.scale button{font:inherit;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:10px 10px 12px;cursor:pointer;min-height:96px;display:flex;flex-direction:column;gap:2px}
.scale button .n{font-size:24px;font-weight:700;line-height:1.1}
.scale button .m{font-size:14px;font-weight:600;line-height:1.25}
.scale button .s{font-size:12.5px;color:var(--muted);line-height:1.25}
.scale button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);border-left-color:var(--c);box-shadow:0 0 0 2px var(--accent) inset}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
@media (max-width:700px){
  .scale{grid-template-columns:1fr}
  .scale button{min-height:0;flex-direction:row;align-items:baseline;gap:12px;padding:12px 14px}
  .scale button .n{font-size:20px;min-width:18px}
  .scale-ends{display:none}
}
.keyhint{font-size:13.5px;color:var(--muted);margin-top:10px}

/* Examples and reviews */
.ex{border-top:1px solid var(--line);padding:16px 0}
.ex:first-of-type{border-top:0}
.ex .stim{font-size:clamp(18px,2.8vw,23px)}
.chip{display:inline-block;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);margin:6px 0 4px}
.chip.hi{border-color:var(--s6);color:var(--s6)}
.chip.lo{border-color:var(--s1);color:var(--s1)}
.rev{list-style:none;margin:0;padding:0}
.rev li{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:start}
.rev li:first-child{border-top:0}
.rev .num{color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.rev .txt{font-family:var(--serif);font-size:18px}
.rev .txt .pre{font-weight:700}
.rev li.missing .txt{color:var(--bad);font-family:var(--sans);font-size:15px}
.mini{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mini button{font:inherit;font-size:14px;font-weight:600;width:34px;height:34px;border-radius:6px;border:1px solid var(--line);border-bottom:3px solid var(--c);background:var(--surface);color:var(--ink);cursor:pointer}
.mini button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:640px){.rev li{grid-template-columns:28px 1fr}.rev li .mini,.rev li .edit{grid-column:2}.mini{justify-content:flex-start}}

/* Forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.form .full{grid-column:1/-1}
.field label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.field .help{font-size:13.5px;color:var(--muted);margin-top:4px}
.field input,.field select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:44px}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field.invalid input,.field.invalid select{border-color:var(--bad)}
.hidden{display:none!important}
@media (max-width:640px){.form{grid-template-columns:1fr}}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);max-width:460px;width:calc(100% - 40px);padding:24px}
dialog::backdrop{background:rgba(10,15,20,.45)}
dialog h2{margin-top:0}

/* Admin */
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-weight:600;color:var(--muted)}
.scroll{overflow-x:auto}
.pass{color:var(--ok);font-weight:600}
.fail{color:var(--bad);font-weight:600}
details{margin-top:16px}
summary{cursor:pointer;font-weight:600}
</style>
</head>

const SCT = SCT_RAW.map(r => ({uid:"SCT-"+r[1], pres:r[0], id:r[1], s1:r[2], s2:r[3], prompt:r[4], npah:r[5], anim:r[6], vclass:r[7], target:r[8], gram:r[9], ungram:r[10], draft:!!r[11]}));
const GJT = GJT_RAW.map(r => ({uid:"GJT-"+r[1], pres:r[0], id:r[1], text:r[2], npah:r[3], type:r[4], anim:r[5], err:r[6], vclass:r[7], draft:!!r[8]}));
const GJT_BY_ID = {}; GJT.forEach(g => GJT_BY_ID[g.id] = g);
const PAIR_KEY = {}; GJT_PAIRS.forEach(p => { const k = "P" + Math.min(p[0],p[1]) + "-" + Math.max(p[0],p[1]); PAIR_KEY[p[0]] = k; PAIR_KEY[p[1]] = k; });

const SCT_ACTIVE = SCT.filter(i => CONFIG.includeDraftItems || !i.draft);
const GJT_ACTIVE = GJT.filter(i => CONFIG.includeDraftItems || !i.draft);

const GJT_SEQ = [];
GJT_ACTIVE.forEach(it => {

});
const FRAME_SEQ = FRAME_ITEMS.map(f => ({uid:"FRAME-"+f.id, kind:"frame", text:f.text, it:f}));

const PARTS = ["SCT","GJT"].concat(CONFIG.includeFrameControl ? ["FRAME"] : []);
const RATE = {
  GJT:   {seq:GJT_SEQ,   screen:"gjt_item",   review:"gjt_review", next:null},
  FRAME: {seq:FRAME_SEQ, screen:"frame_item", review:null,         next:"finish"}

/* ============================================================
   Utilities
   ============================================================ */
const app = document.getElementById("app");
const P = new URLSearchParams(location.search);
const ADMIN = P.get("admin") === "1";
const TEST = P.get("test") === "1";
const STORE_KEY = CONFIG.studyId + ":" + CONFIG.instrumentVersion + ":session";

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nowIso = () => new Date().toISOString();
const perf = () => (window.performance && performance.now) ? performance.now() : Date.now();
function uuid(){
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch(e){}
  return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
}
function words(s){ return String(s || "").trim().split(/\s+/).filter(Boolean).length; }
function mm(q){ try { return window.matchMedia ? window.matchMedia(q).matches : false; } catch(e){ return false; } }

function save(){ if (ADMIN) return; try { if (S) localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){} }
function loadStored(){ try { const t = localStorage.getItem(STORE_KEY); return t ? JSON.parse(t) : null; } catch(e){ return null; } }
function clearStored(){ try { localStorage.removeItem(STORE_KEY); } catch(e){} }

async function sha256(str){
  try {
    if (!(window.crypto && crypto.subtle && window.TextEncoder)) return null;
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  } catch(e){ return null; }
}

function deviceInfo(){
  const coarse = mm("(pointer: coarse)"), fine = mm("(any-pointer: fine)");
  const ua = navigator.userAgent || "";
  const sw = (window.screen && screen.width) || 0, sh = (window.screen && screen.height) || 0;
  const minDim = Math.min(sw || 9999, sh || 9999);
  const phoneUA = /iPhone|iPod|Android.+Mobile|Windows Phone|Opera Mini|IEMobile/i.test(ua);
  const tabletUA = /iPad|Tablet|Android(?!.*Mobile)/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let type = "desktop";
  if (!tabletUA && (phoneUA || (coarse && !fine && minDim < 600))) type = "phone";
  else if (tabletUA || (coarse && !fine)) type = "tablet";
  return {device_type:type, pointer: coarse ? (fine ? "mixed" : "coarse") : "fine", screen_w:sw, screen_h:sh, viewport_w:window.innerWidth, viewport_h:window.innerHeight, user_agent:ua};
}

/* ============================================================
   Session state (persisted to localStorage for refresh-resume)
   ============================================================ */
let S = null;
let cur = null;              // item currently on screen: {uid, t0, startValue}
let finishState = "saving";  // saving | saved | failed | local
let renderToken = 0;

function newState(group, hash, platformPresent){
  return {
    v: 3, session_id: uuid(), created_at: nowIso(), group: group,
    platform_id_hash: hash, platform_id_present: !!platformPresent,
    is_test: TEST, screen: "consent", idx: 0, fromReview: false,
    participant_id: "", demo: {}, consent_at: null,
    resp: {}, submitted: {SCT:false, GJT:false, FRAME:false},
    times: {}, tab: {leaves:0, away_ms:0, by_part:{}},
    keyboard_events_seen: false, device: deviceInfo(),
    rows: {}, outbox: [], completed: false
  };
}

function partOf(screen){
  if (/^sct_/.test(screen)) return "SCT";
  if (/^gjt_/.test(screen)) return "GJT";
  if (/^frame_/.test(screen)) return "FRAME";
  return null;
}
function inTask(){ return S && partOf(S.screen) && !S.completed; }

function getResp(st, uid){
  if (!st.resp[uid]) st.resp[uid] = {value:null, first_value:null, first_resp_ms:null, time_ms:0, visits:0, changes:0, keystrokes:0, last_ts:null};
  return st.resp[uid];
}

function enterItem(uid){
  if (cur && cur.uid === uid) return;
  const r = getResp(S, uid);
  r.visits++;
  cur = {uid:uid, t0:perf(), startValue:r.value};
}
function markFirstResponse(uid){
  const r = getResp(S, uid);
  if (r.first_resp_ms == null && cur && cur.uid === uid) r.first_resp_ms = Math.round(perf() - cur.t0);
}
function leaveItem(){
  if (!cur) return;
  const r = getResp(S, cur.uid);
  r.time_ms += Math.round(perf() - cur.t0);
  const isSct = cur.uid.indexOf("SCT-") === 0;
  const hasVal = r.value != null && String(r.value).trim() !== "";
  if (r.first_value == null && hasVal) r.first_value = r.value;
  else if (isSct && cur.startValue != null && String(cur.startValue).trim() !== "" && r.value !== cur.startValue) r.changes++;
  r.last_ts = nowIso();
  const uid = cur.uid;
  cur = null;
  enqueueItem(uid);
  save();
  flush();
}

/* ============================================================
   Row builders (one row per item per participant, long format)
   ============================================================ */
function baseRow(st){
  const d = st.demo || {};
  return {
    study_id: CONFIG.studyId, instrument_version: CONFIG.instrumentVersion,
    session_id: st.session_id, participant_id: st.participant_id, group: st.group,
    platform_id_hash: st.platform_id_hash || "", is_test: !!st.is_test,
    include_draft_items: CONFIG.includeDraftItems, include_catch_items: CONFIG.includeCatchItems,
    device_type: st.device.device_type, pointer: st.device.pointer,
    screen_w: st.device.screen_w, screen_h: st.device.screen_h,
    keyboard_events_seen: !!st.keyboard_events_seen,
    age: d.age || "", gender: d.gender || "", education: d.education || "",
    first_languages: d.first_languages || "", other_languages: d.other_languages || "",
    years_english: d.years_english || "", proficiency_self: d.proficiency || "",
    institution: d.institution || "", class_group: d.class_group || "",
    study_abroad: d.study_abroad || "", abroad_months: d.abroad_months || "",
    country: d.country || ""
  };
}

function sctFlags(prefix, cont){
  const full = (prefix + " " + (cont || "")).trim();
  const c = cont || "";
  return {
    flag_conjunction: /\b(and|but|because)\b/i.test(c),
    flag_no_rel_pronoun: !/\b(who|whom|which|that|whose)\b/i.test(c),
    flag_possible_resumptive: /\b(who|whom|which|that|whose)\b.*\b(him|her|it|them|its|his|their|he|she|they)\b/i.test(c),
    word_count: words(full),
    continuation_word_count: words(c)
  };
}

function gjtScore(type, rating){
  if (rating == null) return {binary_score:"", classification:"no_response"};
  const ok = (type === "Gram") ? rating >= 4 : rating <= 3;
  return {binary_score: ok ? 1 : 0, ok:ok};
}

function itemRow(st, uid){
  const r = getResp(st, uid);
  const common = {
    item_uid: uid, n_visits: r.visits, n_changes: r.changes,
    time_on_item_ms: r.time_ms, first_response_latency_ms: r.first_resp_ms == null ? "" : r.first_resp_ms,
    answered_at: r.last_ts || ""
  };
  if (uid.indexOf("SCT-") === 0){
    const it = SCT.find(x => x.uid === uid);
    const cont = (r.value || "").trim();
    const first = r.first_value == null ? "" : String(r.first_value).trim();
    return Object.assign(baseRow(st), {
      sheet:"sct", task:"SCT", item_type:"item", item_id: it.id, presentation_position: it.pres,
      npah: it.npah, animacy: it.anim, verb_class: it.vclass, is_draft: it.draft,
      prompt: it.prompt, source_1: it.s1, source_2: it.s2, target: it.target,
      gjt_gram_match: it.gram, gjt_ungram_match: it.ungram,
      prefix: it.prompt, continuation: cont, full_sentence: cont ? it.prompt + " " + cont : "",
      first_response: first ? it.prompt + " " + first : "",
      n_keystrokes: r.keystrokes
    }, common, sctFlags(it.prompt, cont), {
      score:"", error_code:"", variant:"", register_flag:"", frame_deviation:"", rater_id:"", rater_note:""
    });
  }
  if (uid.indexOf("GJT-") === 0){
    const it = GJT.find(x => x.uid === uid);
    const rating = r.value;
    const sc = gjtScore(it.type, rating);
    let cls = "no_response";
    if (rating != null) cls = sc.ok ? "correct" : (it.type === "Ungram" ? "GJT-" + it.err : "GJT-REJ-" + it.npah);
    return Object.assign(baseRow(st), {
      sheet:"gjt", task:"GJT", item_type:"item", item_id: it.id, presentation_position: it.pres,
      sentence: it.text, npah: it.npah, gram_type: it.type, animacy: it.anim,
      error_code: it.err, verb_class: it.vclass, is_draft: it.draft, pair_key: PAIR_KEY[it.id] || "",
      rating: rating == null ? "" : rating, first_rating: r.first_value == null ? "" : r.first_value,
      binary_score: sc.binary_score, classification: cls
    }, common);
  }
  if (uid.indexOf("CATCH-") === 0){
    const c = CATCH_ITEMS.find(x => x.uid === uid);
    const rating = r.value;
    const pass = rating == null ? "" : (c.expect === "high" ? rating >= 4 : rating <= 3);
    return Object.assign(baseRow(st), {
      sheet:"gjt", task:"GJT", item_type:"catch", item_id: c.uid, presentation_position: "",
      inserted_after_pres: c.afterPres, sentence: c.text, catch_expect: c.expect,
      rating: rating == null ? "" : rating, first_rating: r.first_value == null ? "" : r.first_value,
      catch_pass: pass
    }, common);
  }
  if (uid.indexOf("FRAME-") === 0){
    const f = FRAME_ITEMS.find(x => "FRAME-" + x.id === uid);
    const rating = r.value;
    const sc = gjtScore(f.type, rating);
    return Object.assign(baseRow(st), {
      sheet:"frame", task:"FRAME", item_type:"frame_control", item_id: f.id,
      presentation_position: FRAME_ITEMS.indexOf(f) + 1, sentence: f.text, gram_type: f.type,
      verb: f.verb, verb_class: f.vclass, rating: rating == null ? "" : rating,
      first_rating: r.first_value == null ? "" : r.first_value, binary_score: sc.binary_score
    }, common);
  }
  return null;
}

function computeFlags(st){
  const ratings = GJT_ACTIVE.map(it => (st.resp[it.uid] || {}).value);
  let run = 0, maxRun = 0, prev = null;
  ratings.forEach(v => { if (v != null && v === prev) run++; else run = 1; prev = v; if (v != null) maxRun = Math.max(maxRun, run); });
  const tooFast = GJT_ACTIVE.filter(it => { const r = st.resp[it.uid]; return r && r.value != null && r.time_ms < CONFIG.minGjtMs; }).length;
  const sctShort = SCT_ACTIVE.filter(it => { const r = st.resp[it.uid]; return !r || words(r.value) < CONFIG.minSctWords; }).length;
  let catchFail = 0, catchN = 0;
  if (CONFIG.includeCatchItems) CATCH_ITEMS.forEach(c => { const r = st.resp[c.uid]; if (r && r.value != null){ catchN++; const pass = c.expect === "high" ? r.value >= 4 : r.value <= 3; if (!pass) catchFail++; } });
  const t0 = st.times.sct_start ? Date.parse(st.times.sct_start) : null;
  const t1 = st.times.finish ? Date.parse(st.times.finish) : (st.times.gjt_end ? Date.parse(st.times.gjt_end) : null);
  const totalMin = (t0 && t1) ? Math.round((t1 - t0) / 6000) / 10 : "";
  const flags = {
    flag_catch_fail: catchFail > 0, catch_answered: catchN, catch_failed: catchFail,
    straight_line_max_run: maxRun, flag_straight_line: maxRun >= CONFIG.straightLineRun,
    gjt_too_fast_count: tooFast, sct_short_answer_count: sctShort,
    total_minutes: totalMin, flag_too_short_total: totalMin !== "" && totalMin < CONFIG.minTotalMinutes,
    tab_leaves: st.tab.leaves, tab_away_ms: st.tab.away_ms,
    tab_leaves_sct: (st.tab.by_part.SCT || 0), tab_leaves_gjt: (st.tab.by_part.GJT || 0)
  };
  flags.flag_any = !!(flags.flag_catch_fail || flags.flag_straight_line || flags.flag_too_short_total || tooFast >= 10 || sctShort >= 5);
  return flags;
}

function sessionRow(st){
  const ms = (a,b) => (st.times[a] && st.times[b]) ? (Date.parse(st.times[b]) - Date.parse(st.times[a])) : "";
  const gjtScored = GJT_ACTIVE.map(it => itemRow(st, it.uid));
  const gjtTotal = gjtScored.reduce((s,r) => s + (r.binary_score === 1 ? 1 : 0), 0);
  const sctAnswered = SCT_ACTIVE.filter(it => { const r = st.resp[it.uid]; return r && String(r.value || "").trim(); }).length;
  return Object.assign(baseRow(st), {
    sheet:"session", item_uid:"SESSION", created_at: st.created_at, consent_at: st.consent_at || "",
    sct_start: st.times.sct_start || "", sct_end: st.times.sct_end || "",
    gjt_start: st.times.gjt_start || "", gjt_end: st.times.gjt_end || "",
    frame_start: st.times.frame_start || "", frame_end: st.times.frame_end || "",
    finished_at: st.times.finish || "", sct_duration_ms: ms("sct_start","sct_end"),
    gjt_duration_ms: ms("gjt_start","gjt_end"), completed: !!st.completed,
    sct_items: SCT_ACTIVE.length, sct_answered: sctAnswered,
    gjt_items: GJT_ACTIVE.length, gjt_total_binary: gjtTotal,
    task_order: PARTS.join(">"), viewport_w: st.device.viewport_w, viewport_h: st.device.viewport_h,
    user_agent: st.device.user_agent
  }, computeFlags(st));
}

function stampAndQueue(st, row){
  const prev = st.rows[row.item_uid];
  row.row_version = (prev ? prev.row_version : 0) + 1;
  row.saved_at = nowIso();
  st.rows[row.item_uid] = row;
  st.outbox = st.outbox.filter(r => !(r.session_id === row.session_id && r.item_uid === row.item_uid));
  st.outbox.push(row);
}
function enqueueItem(uid){ const row = itemRow(S, uid); if (row) stampAndQueue(S, row); }
function enqueueSession(){ stampAndQueue(S, sessionRow(S)); }

/* ============================================================
   Saving: incremental, confirmed, with retry
   ============================================================ */
let sending = false, backoff = 2000, retryTimer = null;
async function flush(){
  if (!CONFIG.dataEndpoint || !S || !S.outbox.length || sending) return;
  sending = true;
  const batch = S.outbox.slice(0, 40);
  try {
    const res = await fetch(CONFIG.dataEndpoint, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({token: CONFIG.studyToken, rows: batch})
    });
    const j = await res.json();
    if (!j || !j.ok) throw new Error((j && j.error) || "save_rejected");
    S.outbox = S.outbox.filter(r => !batch.some(b => b.session_id === r.session_id && b.item_uid === r.item_uid && b.row_version === r.row_version));
    backoff = 2000;
    save();
    sending = false;
    if (S.outbox.length) setTimeout(flush, 50);
  } catch(e){
    sending = false;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(flush, backoff);
    backoff = Math.min(backoff * 2, 60000);
  }
}
function waitForEmptyOutbox(timeoutMs){
  return new Promise(resolve => {
    const t0 = Date.now();
    (function poll(){
      if (!S.outbox.length) return resolve(true);
      if (Date.now() - t0 > timeoutMs) return resolve(false);
      flush();
      setTimeout(poll, 600);
    })();
  });
}
window.addEventListener("online", () => flush());
setInterval(() => flush(), 30000);

/* ============================================================
   Downloads (backup and researcher use)
   ============================================================ */
function toCsv(rows){
  const cols = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if (cols.indexOf(k) < 0) cols.push(k); }));
  const cell = v => { const s = v == null ? "" : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  return "\ufeff" + [cols.join(",")].concat(rows.map(r => cols.map(c => cell(r[c])).join(","))).join("\r\n");
}
function download(name, text, mime){
  const blob = new Blob([text], {type: mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function allRowsOf(st){
  const rows = [];
  SCT_ACTIVE.forEach(it => rows.push(st.rows[it.uid] || itemRow(st, it.uid)));
  GJT_SEQ.forEach(s => rows.push(st.rows[s.uid] || itemRow(st, s.uid)));
  if (CONFIG.includeFrameControl) FRAME_SEQ.forEach(s => rows.push(st.rows[s.uid] || itemRow(st, s.uid)));
  return rows;
}
function downloadCsv(st){ download(fileBase(st) + "_items.csv", toCsv(allRowsOf(st)), "text/csv;charset=utf-8"); }
function downloadJson(st){
  const out = {study_id: CONFIG.studyId, instrument_version: CONFIG.instrumentVersion, exported_at: nowIso(),
               session: st.rows.SESSION || sessionRow(st), items: allRowsOf(st)};
  download(fileBase(st) + "_all.json", JSON.stringify(out, null, 2), "application/json");
}
function fileBase(st){ return CONFIG.studyId + "_" + (st.participant_id || "anon") + "_" + st.session_id.slice(0,8); }

/* ============================================================
   Dialog
   ============================================================ */
function confirmDialog(title, body, okLabel){
  const dlg = document.getElementById("dlg");
  if (!dlg || typeof dlg.showModal !== "function") return Promise.resolve(window.confirm(title + "\n\n" + body));
  document.getElementById("dlg-title").textContent = title;
  document.getElementById("dlg-body").textContent = body;
  document.getElementById("dlg-ok").textContent = okLabel || "Submit";
  return new Promise(resolve => {
    const ok = document.getElementById("dlg-ok"), cancel = document.getElementById("dlg-cancel");
    const done = v => { ok.onclick = null; cancel.onclick = null; dlg.close(); resolve(v); };
    ok.onclick = () => done(true); cancel.onclick = () => done(false);
    dlg.oncancel = e => { e.preventDefault(); done(false); };
    dlg.showModal();
    cancel.focus();
  });
}

/* ============================================================
   Navigation and rendering
   ============================================================ */
function go(screen, idx){
  leaveItem();
  const prevScreen = S.screen;
  S.screen = screen;
  S.idx = idx || 0;
  save();
  const isRate = screen === "gjt_item" || screen === "frame_item";
  if (isRate && prevScreen === screen){
    // 300 ms blank between judgment items to reduce carry-over
    const token = ++renderToken;
    app.innerHTML = header() + '<main><div class="stim-wrap" aria-hidden="true"></div></main>';
    setTimeout(() => { if (token === renderToken) render(); }, 300);
  } else {
    render();
  }
  window.scrollTo(0, 0);
}

function header(){
  const part = S ? partOf(S.screen) : null;
  let left = '<span class="brand">English sentence study</span>', right = "", pct = null;
  if (part){
    const n = PARTS.indexOf(part) + 1;
    const name = {SCT:"Sentence combining", GJT:"Sentence judgment", FRAME:"Short sentence check"}[part];
    left = '<span class="brand">Part ' + n + ' of ' + PARTS.length + ' <span class="part">· ' + name + '</span></span>';
    if (S.screen === "sct_item"){ right = "Item " + (S.idx + 1) + " of " + SCT_ACTIVE.length; pct = (S.idx + 1) / SCT_ACTIVE.length; }
    if (S.screen === "gjt_item"){ const k = realIndex(S.idx); right = "Item " + k + " of " + GJT_ACTIVE.length; pct = k / GJT_ACTIVE.length; }
    if (S.screen === "frame_item"){ right = "Item " + (S.idx + 1) + " of " + FRAME_SEQ.length; pct = (S.idx + 1) / FRAME_SEQ.length; }
  }
  return '<header class="top"><div class="top-inner">' + left + (right ? '<span class="progress-text">' + right + '</span>' : '') + '</div>' +
         (pct != null ? '<div class="bar"><span style="width:' + Math.round(pct * 100) + '%"></span></div>' : '') + '</header>';
}
function realIndex(i){ let k = 0; for (let j = 0; j <= i && j < GJT_SEQ.length; j++) if (GJT_SEQ[j].kind === "item") k++; return Math.max(k, 1); }

function page(inner, narrow){ window.onresize = null; app.innerHTML = header() + '<main' + (narrow ? ' class="narrow"' : '') + '>' + inner + '</main>'; }

function render(){
  renderToken++;
  const fn = SCREENS[S.screen];
  if (!fn){ S.screen = "consent"; return render(); }
  fn();
  const h = app.querySelector("h1");
  if (h && !app.querySelector("textarea, .scale")) { h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); }
}

  sct_intro(){

      '<p class="lede">Please read these instructions carefully before beginning.</p>' +
      '<p>This task contains ' + SCT_ACTIVE.length + ' items. For each item, you will see two short sentences. Your job is to combine each pair of sentences into <strong>ONE</strong> sentence by using a <strong>relative pronoun</strong> (such as <em>who, which, whom, whose</em>).</p>' +
      '<p>A preposition may come <strong>before</strong> the relative pronoun (e.g., <em>with whom</em>) or <strong>after</strong> it (e.g., <em>who...with</em>).</p>' +
      '<h2>Important guidelines</h2><ul class="guide">' +
      '<li><strong>Begin each answer with the word or words provided</strong> in the prompt.</li>' +
      '<li><strong>Do NOT use</strong> "and," "but," or "because" to join the sentences.</li>' +
      '<li><strong>Do NOT omit any information</strong> from the original sentences.</li>' +
      '<li><strong>Accuracy is more important than speed.</strong> You may take as much time as you need.</li>' +
      '<li><strong>You may revise your answers</strong> if you think they are incorrect.</li></ul>' +

  sct_item(){
    const i = S.idx, it = SCT_ACTIVE[i];

    const r = getResp(S, it.uid);

    const nav = S.fromReview
      ? '<div class="actions end"><button class="btn" data-act="sct_back_review">Save and return to review</button></div>'
      : '<div class="actions"><button class="btn ghost" data-act="sct_prev"' + (i === 0 ? ' disabled' : '') + '>Previous</button><button class="btn" data-act="sct_next">' + (last ? 'Review my answers' : 'Next') + '</button></div>';
    page('<div class="card"><p class="label">Combine these two sentences into one sentence.</p>' +
      '<div class="sources" oncopy="return false"><p>' + esc(it.s1) + '</p><p>' + esc(it.s2) + '</p></div></div>' +
      '<div style="margin-top:20px"><label class="label" for="cont">Your sentence</label>' +
      '<div class="answer"><span class="prefix" id="prefix">' + esc(it.prompt) + '</span>' +
      '<textarea id="cont" rows="3" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" aria-describedby="prefix sct_err">' + esc(r.value || "") + '</textarea></div>' +
      '<p class="error" id="sct_err" role="alert"></p></div>' + nav, true);
    const ta = document.getElementById("cont"), pre = document.getElementById("prefix");
    const indent = () => { ta.style.textIndent = (pre.offsetWidth + 8) + "px"; };
    indent(); window.onresize = indent;
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(indent);
    let saveTimer = null;
    ta.addEventListener("input", () => {
      r.value = ta.value; r.keystrokes++;
      markFirstResponse(it.uid);
      document.getElementById("sct_err").textContent = "";
      clearTimeout(saveTimer); saveTimer = setTimeout(save, 400);
    });
    ta.addEventListener("keydown", e => { if (e.key === "Enter") e.preventDefault(); });
    ["paste","drop"].forEach(ev => ta.addEventListener(ev, e => { e.preventDefault(); document.getElementById("sct_err").textContent = "Please type your answer rather than pasting it."; }));
    ta.focus();
    const len = ta.value.length; try { ta.setSelectionRange(len, len); } catch(e){}
  },

    page('<h1>Review your answers</h1><p>Check each sentence. Select Edit to change an answer. When you are happy with all of them, submit Part 1.</p>' +

function dlButtons(){
  return '<div class="actions" style="justify-content:flex-start"><button class="btn" data-act="dl_csv">Download answers (CSV)</button><button class="btn ghost" data-act="dl_json">Download full record (JSON)</button></div>';

/* Shared 1–6 rating screen for the GJT and the optional frame block */
function rateScreen(task){
  const cfg = RATE[task], i = S.idx, entry = cfg.seq[i];
  enterItem(entry.uid);
  const v = getResp(S, entry.uid).value;
  const last = i === cfg.seq.length - 1;
  const nextLabel = last ? (cfg.review ? "Review my ratings" : "Finish") : "Next";
  page('<div class="stim-wrap"><div class="stim" oncopy="return false">' + esc(entry.text) + '</div></div>' +
    '<div class="scale" role="group" aria-label="Rate this sentence">' + SCALE.map(s =>
      '<button style="--c:' + s.c + '" aria-pressed="' + (v === s.n) + '" data-act="rate" data-v="' + s.n + '"><span class="n">' + s.n + '</span><span class="m">' + s.main + '</span><span class="s">' + s.sub + '</span></button>').join("") + '</div>' +
    '<div class="scale-ends"><span>Incorrect</span><span>Correct</span></div>' +
    '<p class="keyhint">You can also press keys 1–6 to choose, and Enter to go on.</p>' +
    '<p class="error" id="rate_err" role="alert"></p>' +
    '<div class="actions"><button class="btn ghost" data-act="rate_prev"' + (i === 0 ? ' disabled' : '') + '>Previous</button><button class="btn" data-act="rate_next" id="rate_next">' + nextLabel + '</button></div>');
}

function setRating(uid, v){
  const r = getResp(S, uid);
  if (r.value != null && r.value !== v) r.changes++;
  r.value = v;
  markFirstResponse(uid);
  if (r.first_value == null) r.first_value = v;
  save();
}

/* ============================================================
   Actions
   ============================================================ */
const ACTIONS = {
  go: b => go(b.dataset.to),
  device_continue: () => go("consent"),
  resume_continue: () => { const to = S._resumeTo || "consent"; delete S._resumeTo; S.screen = to; save(); render(); },
  resume_new: () => {
    const carry = S.outbox || [];
    S = newState(S.group, S.platform_id_hash, S.platform_id_present);
    S.outbox = carry;
    save(); render(); flush();
  },
  agree: () => { S.consent_at = nowIso(); go("about"); },
  decline: () => { S.screen = "declined"; save(); render(); },   // nothing is queued; unsent rows from an earlier person on this browser are kept

  about_submit: () => {
    const f = document.getElementById("about");
    const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
    const bad = [];
    f.querySelectorAll(".field").forEach(x => x.classList.remove("invalid"));
    const mark = id => { const el = document.getElementById(id); if (el) el.closest(".field").classList.add("invalid"); bad.push(id); };
    const pid = val("pid");
    if (!/^[A-Za-z0-9]{4,20}$/.test(pid)) mark("pid");
    const age = parseInt(val("age"), 10);
    if (!(age >= CONFIG.minAge && age <= 99)) mark("age");
    if (!val("gender")) mark("gender");
    if (val("gender") === "Prefer to self-describe" && !val("gender_self")) mark("gender_self");
    if (!val("education")) mark("education");
    if (!val("first_languages")) mark("first_languages");
    if (S.group === "native"){
      if (!val("country")) mark("country");
      if (val("country") === "Other" && !val("country_other")) mark("country_other");
    } else {
      const y = val("years_english");
      if (y === "" || isNaN(+y) || +y < 0 || +y > 40) mark("years_english");
      if (!val("proficiency")) mark("proficiency");
      if (!val("study_abroad")) mark("study_abroad");
    }
    const err = document.getElementById("about_err");
    if (bad.length){
      err.textContent = bad.indexOf("pid") >= 0 && bad.length === 1
        ? "Your Participant ID needs 4 to 20 letters or numbers, with no spaces."
        : (bad.indexOf("age") >= 0 && age && age < CONFIG.minAge ? "You need to be at least " + CONFIG.minAge + " to take part." : "Please complete the highlighted fields.");
      const first = document.getElementById(bad[0]); if (first) first.focus();
      return;
    }
    S.participant_id = pid;
    const gc = val("gender");
    S.demo = {
      age: age, gender_choice: gc, gender_self: val("gender_self"),
      gender: gc === "Prefer to self-describe" ? "Self-described: " + val("gender_self") : gc,
      education: val("education"), first_languages: val("first_languages"), other_languages: val("other_languages")
    };
    if (S.group === "native"){
      S.demo.country_choice = val("country"); S.demo.country_other = val("country_other");
      S.demo.country = val("country") === "Other" ? val("country_other") : val("country");
    } else {
      Object.assign(S.demo, {years_english: val("years_english"), proficiency: val("proficiency"),
        institution: val("institution"), class_group: val("class_group"),
        study_abroad: val("study_abroad"), abroad_months: val("study_abroad") === "Yes" ? val("abroad_months") : ""});
    }
    go("sct_intro");
  },

  sct_start: () => { if (!S.times.sct_start) S.times.sct_start = nowIso(); go("sct_item", 0); },
  sct_prev: () => { if (S.idx > 0) go("sct_item", S.idx - 1); },
  sct_next: () => {
    const it = SCT_ACTIVE[S.idx];
    if (CONFIG.requireAllAnswers && !String(getResp(S, it.uid).value || "").trim()){
      document.getElementById("sct_err").textContent = "Please complete the sentence before moving on.";
      document.getElementById("cont").focus(); return;
    }
    if (S.idx < SCT_ACTIVE.length - 1) go("sct_item", S.idx + 1); else go("sct_review");
  },
  sct_edit: b => { S.fromReview = true; go("sct_item", +b.dataset.i); },
  sct_back_review: () => {
    const it = SCT_ACTIVE[S.idx];
    if (CONFIG.requireAllAnswers && !String(getResp(S, it.uid).value || "").trim()){
      document.getElementById("sct_err").textContent = "Please complete the sentence before returning to the review."; return;
    }
    S.fromReview = false; go("sct_review");
  },
  sct_submit: async () => {
    const missing = SCT_ACTIVE.filter(it => !String(getResp(S, it.uid).value || "").trim());
    if (CONFIG.requireAllAnswers && missing.length){
      document.getElementById("rev_err").textContent = "Please answer every item before submitting (" + missing.length + " missing)."; return;
    }
    const ok = await confirmDialog("Submit Part 1?", "After submitting, you will not be able to change your answers in Part 1.", "Submit Part 1");
    if (!ok) return;
    S.submitted.SCT = true; S.times.sct_end = nowIso();
    SCT_ACTIVE.forEach(it => enqueueItem(it.uid));
    enqueueSession(); save(); flush();
    go("sct_break");
  },

  gjt_start: () => { if (!S.times.gjt_start) S.times.gjt_start = nowIso(); go("gjt_item", 0); },
  frame_start: () => { if (!S.times.frame_start) S.times.frame_start = nowIso(); go("frame_item", 0); },

  rate: b => {
    const task = S.screen === "frame_item" ? "FRAME" : "GJT";
    const entry = RATE[task].seq[S.idx];
    const v = +b.dataset.v;
    setRating(entry.uid, v);
    app.querySelectorAll(".scale button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.v === v)));
    const e = document.getElementById("rate_err"); if (e) e.textContent = "";
  },
  rate_prev: () => { if (S.idx > 0) go(S.screen, S.idx - 1); },
  rate_next: () => {
    const task = S.screen === "frame_item" ? "FRAME" : "GJT", cfg = RATE[task];
    const entry = cfg.seq[S.idx];
    if (CONFIG.requireAllAnswers && getResp(S, entry.uid).value == null){
      document.getElementById("rate_err").textContent = "Please choose a number from 1 to 6."; return;
    }
    if (S.idx < cfg.seq.length - 1) return go(cfg.screen, S.idx + 1);
    if (cfg.review) return go(cfg.review);
    S.submitted.FRAME = true; S.times.frame_end = nowIso();
    go("finish"); runFinish();
  },
  gjt_review_rate: b => {
    const uid = b.dataset.uid, v = +b.dataset.v;
    setRating(uid, v);
    b.parentNode.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.v === v)));
    b.closest("li").classList.remove("missing");
    enqueueItem(uid); save(); flush();
  },
  gjt_submit: async () => {
    const missing = GJT_ACTIVE.filter(it => getResp(S, it.uid).value == null);
    if (CONFIG.requireAllAnswers && missing.length){
      document.getElementById("rev_err").textContent = "Please rate every sentence before submitting (" + missing.length + " missing)."; return;
    }
    const ok = await confirmDialog("Submit Part 2?", "After submitting, you will not be able to change your ratings in Part 2.", "Submit Part 2");
    if (!ok) return;
    S.submitted.GJT = true; S.times.gjt_end = nowIso();
    GJT_ACTIVE.forEach(it => enqueueItem(it.uid));
    save(); flush();
    if (CONFIG.includeFrameControl) return go("frame_intro");
    go("finish"); runFinish();
  },

  retry_save: () => { runFinish(); },
  dl_csv: () => downloadCsv(S),
  dl_json: () => downloadJson(S),

  adm_sim: () => simulate(),
  adm_clear: () => { clearStored(); document.getElementById("adm_msg").textContent = "Saved session cleared from this browser."; }
};

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  e.preventDefault();
  const fn = ACTIONS[b.dataset.act];
  if (fn) fn(b, e);
});
app.addEventListener("submit", e => { if (e.target.id === "about"){ e.preventDefault(); ACTIONS.about_submit(); } });

document.addEventListener("keydown", e => {
  if (!S) return;
  if (e.key && e.key.length === 1 && e.key !== "Unidentified") S.keyboard_events_seen = true;
  if ((S.screen === "gjt_item" || S.screen === "frame_item") && !e.altKey && !e.ctrlKey && !e.metaKey){
    if (/^[1-6]$/.test(e.key)){ const b = app.querySelector('.scale button[data-v="' + e.key + '"]'); if (b) ACTIONS.rate(b); e.preventDefault(); }
    else if (e.key === "Enter" && !(document.getElementById("dlg") || {}).open){ const b = document.getElementById("rate_next"); if (b){ e.preventDefault(); ACTIONS.rate_next(); } }
  }
});

let hiddenAt = null;
document.addEventListener("visibilitychange", () => {
  if (!S) return;
  if (document.hidden){
    hiddenAt = perf();
    if (inTask()){ S.tab.leaves++; const p = partOf(S.screen); S.tab.by_part[p] = (S.tab.by_part[p] || 0) + 1; }
    save(); flush();
  } else if (hiddenAt != null){
    const d = perf() - hiddenAt;
    if (inTask()) S.tab.away_ms += Math.round(d);
    if (cur) cur.t0 += d;   // time on item counts only while the page is visible
    hiddenAt = null; save();
  }
});
window.addEventListener("beforeunload", e => {
  if (!S) return;
  if (cur){ const r = getResp(S, cur.uid); r.time_ms += Math.round(perf() - cur.t0); cur.t0 = perf(); }
  save();
  if (inTask() || (S.screen === "finish" && S.outbox.length)){ e.preventDefault(); e.returnValue = ""; }
});

/* ============================================================
   Finish
   ============================================================ */
async function runFinish(){
  finishState = "saving"; render();
  if (!S.completed){ S.times.finish = nowIso(); S.completed = true; }
  enqueueSession(); save();
  if (!CONFIG.dataEndpoint){ finishState = "local"; render(); return; }
  backoff = 1000; clearTimeout(retryTimer);
  const ok = await waitForEmptyOutbox(30000);
  finishState = ok ? "saved" : "failed";
  render();
  if (ok && CONFIG.completionUrl) setTimeout(() => { location.href = CONFIG.completionUrl; }, 5000);
}

/* ============================================================
   Researcher mode (?admin=1)
   ============================================================ */
function selfCheck(){
  const out = [];
  const add = (label, pass, detail) => out.push({label:label, pass:!!pass, detail:detail || ""});
  const count = (arr, f) => arr.filter(f).length;
  add("Task order is SCT then GJT", PARTS[0] === "SCT" && PARTS[1] === "GJT", PARTS.join(" > "));
  add("SCT has 26 items", SCT.length === 26, SCT.length);
  add("GJT has 52 items", GJT.length === 52, GJT.length);
  add("SCT pres numbers run 1–26 in order", SCT.every((it, i) => it.pres === i + 1));
  add("GJT pres numbers run 1–52 in order", GJT.every((it, i) => it.pres === i + 1));
  add("Participant sees SCT items in documented order", SCT_ACTIVE.every((it, i, a) => i === 0 || it.pres > a[i-1].pres));
  add("Participant sees GJT items in documented order", GJT_SEQ.filter(s => s.kind === "item").every((s, i, a) => i === 0 || s.it.pres > a[i-1].it.pres));
  add("Unique item IDs", new Set(SCT.map(x => x.id)).size === 26 && new Set(GJT.map(x => x.id)).size === 52);
  add("GJT 26 Gram / 26 Ungram", count(GJT, g => g.type === "Gram") === 26);
  add("GJT 26 animate / 26 inanimate", count(GJT, g => g.anim === "A") === 26);
  const npahs = ["SU","DO","IO","OBL","GEN","OCOMP"];
  const cellOk = npahs.every(n => { const per = n === "IO" ? 3 : 2; return ["Gram","Ungram"].every(t => ["A","I"].every(a => count(GJT, g => g.npah === n && g.type === t && g.anim === a) === per)); });
  add("GJT NPAH × type × animacy cells (2 each, IO 3 each)", cellOk);
  add("SCT per NPAH: 4 each, IO 6", npahs.every(n => count(SCT, s => s.npah === n) === (n === "IO" ? 6 : 4)));
  add("SCT 13 animate / 13 inanimate", count(SCT, s => s.anim === "A") === 13);
  const badMatch = SCT.filter(s => { const g = GJT_BY_ID[s.gram], u = GJT_BY_ID[s.ungram]; return !g || !u || g.type !== "Gram" || u.type !== "Ungram" || g.npah !== s.npah || u.npah !== s.npah || g.anim !== s.anim || u.anim !== s.anim; });
  add("Every SCT item matches a Gram and an Ungram GJT item with the same NPAH and animacy", !badMatch.length, badMatch.map(s => "SCT " + s.id).join(", "));
  add("Every GJT item belongs to exactly one minimal pair", GJT.every(g => PAIR_KEY[g.id]) && GJT_PAIRS.length === 26 && new Set(GJT_PAIRS.flat()).size === 52);
  add("Draft items flagged: GJT 49–52, SCT 25–26", GJT.filter(g => g.draft).map(g => g.id).sort().join() === "49,50,51,52" && SCT.filter(s => s.draft).map(s => s.id).sort().join() === "25,26");
  add("SCT targets begin with their prompt", SCT.every(s => s.target.indexOf(s.prompt) === 0), SCT.filter(s => s.target.indexOf(s.prompt) !== 0).map(s => "SCT " + s.id).join(", "));
  add("Data endpoint set", !!CONFIG.dataEndpoint, CONFIG.dataEndpoint ? "" : "Empty: participants will be asked to download their answers.");
  add("Placeholders replaced (token, salt, admin password, researcher name)", CONFIG.studyToken.indexOf("CHANGE-ME") < 0 && CONFIG.hashSalt.indexOf("CHANGE-ME") < 0 && CONFIG.adminPassword.indexOf("CHANGE-ME") < 0 && R.name.indexOf("[") < 0);
  return out;
}

function renderAdmin(){
  const checks = selfCheck();
  const base = location.href.split("?")[0];
  const links = CONFIG.groups.map(g => '<li><a href="' + esc(base + "?group=" + encodeURIComponent(g)) + '">' + esc(base + "?group=" + g) + '</a> · <a href="' + esc(base + "?group=" + encodeURIComponent(g) + "&test=1") + '">test run</a></li>').join("");
  const sctRows = SCT.map(s => '<tr><td>' + s.pres + '</td><td>' + s.id + '</td><td>' + s.npah + '</td><td>' + s.anim + '</td><td>' + esc(s.vclass || "—") + '</td><td>' + esc(s.prompt) + '</td><td>' + esc(s.target) + '</td><td>' + s.gram + ' / ' + s.ungram + '</td><td>' + (s.draft ? "draft" : "") + '</td></tr>').join("");
  const gjtRows = GJT_SEQ.map(e => e.kind === "catch"
    ? '<tr><td>—</td><td>' + e.uid + '</td><td colspan="5">' + esc(e.text) + ' <em>(catch, expect ' + e.it.expect + ')</em></td><td></td></tr>'
    : '<tr><td>' + e.it.pres + '</td><td>' + e.it.id + '</td><td>' + e.it.npah + '</td><td>' + e.it.type + '</td><td>' + e.it.anim + '</td><td>' + esc(e.it.err || "—") + '</td><td>' + esc(e.text) + '</td><td>' + (e.it.draft ? "draft" : "") + '</td></tr>').join("");
  page('<h1>Researcher mode</h1>' +
    '<h2>Study links</h2><ul class="guide">' + links + '</ul><p class="muted small">Test runs are marked is_test = true in the data.</p>' +
    '<h2>Self-check</h2><div class="card scroll"><table class="t"><tr><th>Check</th><th>Result</th><th>Detail</th></tr>' +
      checks.map(c => '<tr><td>' + esc(c.label) + '</td><td class="' + (c.pass ? "pass" : "fail") + '">' + (c.pass ? "Pass" : "Check") + '</td><td>' + esc(String(c.detail)) + '</td></tr>').join("") + '</table></div>' +
    '<h2>Tools</h2><div class="actions" style="justify-content:flex-start"><button class="btn" data-act="adm_sim">Download a simulated participant</button><button class="btn ghost" data-act="adm_clear">Clear this browser\'s saved session</button></div><p class="muted small" id="adm_msg"></p>' +
    '<details><summary>SCT items in presentation order</summary><div class="scroll"><table class="t"><tr><th>Pres</th><th>ID</th><th>NPAH</th><th>Anim</th><th>Verb class</th><th>Prompt</th><th>Target</th><th>GJT match</th><th></th></tr>' + sctRows + '</table></div></details>' +
    '<details><summary>GJT sequence as participants see it</summary><div class="scroll"><table class="t"><tr><th>Pres</th><th>ID</th><th>NPAH</th><th>Type</th><th>Anim</th><th>Error</th><th>Sentence</th><th></th></tr>' + gjtRows + '</table></div></details>');
}

function simulate(){
  const st = newState(CONFIG.groups[0], null, false);
  st.is_test = true; st.participant_id = "SIMTEST" + Math.floor(Math.random() * 900 + 100);
  st.demo = {age: 21, gender: "Prefer not to say", education: "Bachelor's student", first_languages: "Moroccan Arabic", other_languages: "French", years_english: "8", proficiency: "4", study_abroad: "No"};
  const t = Date.now();
  st.consent_at = new Date(t).toISOString(); st.times.sct_start = new Date(t + 60000).toISOString();
  SCT_ACTIVE.forEach(it => {
    const r = getResp(st, it.uid);
    const cont = it.target.slice(it.prompt.length).trim();
    r.value = Math.random() < 0.7 ? cont : cont.replace(/\b(whom|which|who)\b/, "and");
    r.first_value = r.value; r.visits = 1; r.time_ms = 20000 + Math.round(Math.random() * 40000); r.first_resp_ms = 3000; r.keystrokes = r.value.length; r.last_ts = nowIso();
  });
  st.times.sct_end = new Date(t + 1400000).toISOString(); st.times.gjt_start = new Date(t + 1500000).toISOString();
  GJT_SEQ.forEach(e => {
    const r = getResp(st, e.uid);
    r.value = 1 + Math.floor(Math.random() * 6); r.first_value = r.value; r.visits = 1; r.time_ms = 2500 + Math.round(Math.random() * 6000); r.first_resp_ms = 2000; r.last_ts = nowIso();
  });
  st.times.gjt_end = new Date(t + 2300000).toISOString(); st.times.finish = st.times.gjt_end; st.completed = true;
  st.rows.SESSION = sessionRow(st);
  downloadCsv(st); setTimeout(() => downloadJson(st), 400);
  document.getElementById("adm_msg").textContent = "Simulated participant " + st.participant_id + " downloaded (CSV and JSON).";
}

/* ============================================================
   Boot
   ============================================================ */
function staticPage(title, body){
  app.innerHTML = '<header class="top"><div class="top-inner"><span class="brand">English sentence study</span></div></header><main class="narrow"><h1>' + title + '</h1>' + body + '</main>';
}

async function boot(){
  if (ADMIN){
    S = newState("admin", null, false); S.screen = "admin_login"; render(); return;
  }
  let group = P.get("group");
  if (!group && !CONFIG.requireGroupParam) group = CONFIG.defaultGroup;
  if (!group || CONFIG.groups.indexOf(group) < 0){
    staticPage("This link is not complete", "<p>Please use the exact link the researcher sent you. If the problem continues, contact " + esc(R.email) + ".</p>");
    return;
  }
  const dev = deviceInfo();
  if (dev.device_type === "phone" && CONFIG.devicePolicy === "block-phones"){
    staticPage("Please switch to a computer", "<p>Part 1 of this study asks you to type sentences, so it needs a laptop or desktop computer with a keyboard.</p><p>Open the same link on a computer to take part. Thank you.</p>");
    return;
  }
  const platformRaw = CONFIG.platformIdParam ? P.get(CONFIG.platformIdParam) : null;
  const hash = platformRaw ? await sha256(CONFIG.hashSalt + "|" + platformRaw) : null;
  const stored = loadStored();

  if (stored && stored.v === 3 && stored.group === group){
    if (stored.completed){
      // A finished session on this browser: start fresh for the next person, carrying any unsent rows.
      S = newState(group, hash, !!platformRaw);
      S.outbox = stored.outbox || [];
    } else if (stored.screen === "consent" || stored.screen === "declined"){
      S = newState(group, hash, !!platformRaw);
      S.outbox = stored.outbox || [];
    } else {
      S = stored;
      S._resumeTo = stored.screen === "resume" ? (stored._resumeTo || "consent") : stored.screen;
      S.screen = "resume";
    }
  } else {
    S = newState(group, hash, !!platformRaw);
    if (stored && stored.outbox && stored.outbox.length) S.outbox = stored.outbox;
  }
  if (TEST) S.is_test = true;
  if (S.screen === "consent" && dev.device_type === "phone" && CONFIG.devicePolicy === "warn") S.screen = "device_warn";
  save();
  render();
  flush();
}

boot();
})();
